<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Engineering Process Monitoring System</h1></header>
<div class="grid">
<div class="card"><h3>Total Project</h3><p id="p1">120</p></div>
<div class="card"><h3>Progress</h3><p>85%</p></div>
<div class="card"><h3>Due Today</h3><p>5</p></div>
<div class="card"><h3>Overdue</h3><p class="red">3</p></div>
</div>
<section class="card">
<h2>Document Status</h2>
<table>
<tr><th>Document</th><th>Status</th></tr>
<tr><td>Flow Process</td><td>95%</td></tr>
<tr><td>PFMEA</td><td>75%</td></tr>
<tr><td>Control Plan</td><td>82%</td></tr>
<tr><td>Work Instruction</td><td>90%</td></tr>
</table>
</section>
<script src="js/app.js"></script>
</body>
</html>
